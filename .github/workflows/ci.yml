name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/customerconnect?schema=public"
  # CI-only values. Real secrets never live in the workflow file (docs/02 §9);
  # this key only ever signs tokens for throwaway CI databases.
  AUTH_SECRET: "ci-only-secret-not-used-anywhere-else-32c"
  ROOT_DOMAIN: "localhost"
  DEFAULT_TENANT_SLUG: "acme"
  # Uploads land in an in-process store; nothing to clean up between jobs.
  STORAGE_DRIVER: "memory"
  # CI-only master key for the credential vault's `env` driver (ADR-042) —
  # wraps/unwraps throwaway CI data only, never a real secret.
  CREDENTIAL_MASTER_KEY: "h/z4mreBytBcGVc6Qak/dgptjhndgszbTQqZUp7CEU0="
  CREDENTIAL_MASTER_KEY_PROVIDER: "env"

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customerconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @cc/db db:generate

      - name: Push schema to CI database
        run: pnpm --filter @cc/db db:push

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Unit tests
        run: pnpm turbo run test

      - name: Cross-tenant isolation tests
        run: pnpm --filter @cc/db test:isolation

      # The onboarding vertical end to end (registry -> service -> mock SAP/
      # GSTN/storage) against a real database, including its own cross-tenant
      # 404 cases. Separate from the unit step because it needs Postgres.
      - name: Onboarding flow tests
        run: pnpm --filter @cc/service-onboarding test:integration

      # The cart is the only stored part of the catalogue module, so it is
      # the only part that needs a database — including its cross-account
      # and cross-tenant 404 cases.
      - name: Cart flow tests
        run: pnpm --filter @cc/service-catalogue test:integration

      # Drafts are the only stored part of the order module. The suite also
      # covers draft -> submit -> read-back-from-SAP, and the cross-account
      # and cross-tenant 404 cases.
      - name: Order flow tests
        run: pnpm --filter @cc/service-order test:integration

      # Payments are the only O2C document the portal stores (ADR-019), so
      # unlike invoices this module needs a database. The suite walks
      # initiate -> signed webhook -> F-28 posting and clearing, and covers
      # webhook replay, partial payment, a SAP posting failure leaving the
      # money accounted for, and the cross-account/cross-tenant 404 cases.
      - name: Payment flow tests
        run: pnpm --filter @cc/service-payment test:integration

      # Proof of delivery is the one stored thing in the delivery module
      # (ADR-026): SAP takes the receipt first, then the portal writes its
      # evidence row and the outbox event in one transaction.
      - name: Delivery / POD tests
        run: pnpm --filter @cc/service-delivery test:integration

      # Drafts are the only portal-owned part of the inquiry module (ADR-016);
      # the suite walks draft -> inquiry -> quotation -> order and covers
      # validity expiry and the customer/desk plane split (ADR-032).
      - name: Inquiry / quotation tests
        run: pnpm --filter @cc/service-inquiry test:integration

      # The one module the portal owns outright (ADR-028): raise -> resolve ->
      # rate, the transition table, and internal notes being excluded in the
      # query rather than the screen.
      - name: Support flow tests
        run: pnpm --filter @cc/service-support test:integration

      # Credit-limit requests are the module's only stored document (ADR-035);
      # the tier ladder and credit position are composed per read, so this
      # suite is what proves a threshold edit re-tiers with nothing to backfill.
      - name: Loyalty / credit tests
        run: pnpm --filter @cc/service-loyalty test:integration

      # event -> recipients -> bell rows -> email mirror, including a customer
      # template with no KUNNR resolving to nobody rather than everybody
      # (ADR-041).
      - name: Notification fan-out tests
        run: pnpm --filter @cc/service-notification test:integration

      # The outbox relay's at-least-once guarantees (ADR-023), the
      # reconciliation sweep (ADR-044) and the SLA sweep (ADR-029). Needs
      # Postgres but no Redis — the publisher is faked at the boundary.
      - name: Worker loop tests
        run: pnpm --filter @cc/workers test:integration

      # The operator console's write paths: provisioning, the per-tenant SAP
      # configuration round trip through the envelope vault, and the
      # append-only trail — including the assertions that a stored secret
      # never comes back out and that the trail holds no values (ADR-053).
      - name: Platform console tests
        run: pnpm --filter @cc/service-platform test:integration

      # The other half of tenant deactivation (ADR-054) *and* of customer
      # deactivation (ADR-057): both set a flag, and this is what proves
      # `login` and the account switcher refuse because of it.
      - name: Deactivation tests (tenant + customer)
        run: pnpm --filter @cc/service-identity test:integration

      # The tenant's customer directory (ADR-057): the list composed from SAP
      # per read, the edit that reaches XD02, and the deactivation that
      # blocks new orders while deleting nothing.
      - name: Customer directory tests
        run: pnpm --filter @cc/service-customer test:integration

      # Proves the seed still matches the schema and the tenant-scoped
      # writes it performs — it is the fixture every future e2e run needs.
      - name: Seed development data
        run: pnpm --filter @cc/service-identity db:seed

      - name: Build
        run: pnpm turbo run build

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      # Module happy paths against the mock adapters (docs/06 definition of
      # done): the onboarding wizard through to back-office approval, the
      # catalogue and cart, and cart -> ATP -> sales order -> cancel.
      - name: E2E smoke tests
        run: pnpm --filter web test:e2e
