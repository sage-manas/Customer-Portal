name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/customerconnect?schema=public"

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customerconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @cc/db db:generate

      - name: Push schema to CI database
        run: pnpm --filter @cc/db db:push

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Unit tests
        run: pnpm turbo run test

      - name: Cross-tenant isolation tests
        run: pnpm --filter @cc/db test:isolation

      - name: Build
        run: pnpm turbo run build

      # e2e (Playwright, per docs/06) is added once module screens exist to
      # exercise — Phase 0 has scaffold pages only, no user flows yet.
